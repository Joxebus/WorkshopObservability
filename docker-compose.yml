services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.10.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 1g

  logstash:
    image: docker.elastic.co/logstash/logstash:7.10.2
    container_name: logstash
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    ports:
      - "4560:4560"
      - "5044:5044"
    volumes:
      - ./logstash-config:/usr/share/logstash/pipeline
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9600/_node/stats || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 768m

  kibana:
    image: docker.elastic.co/kibana/kibana:7.10.2
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 512m

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus-config:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    depends_on:
      - consul
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m

  grafana:
    image: grafana/grafana:10.0.3
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_SECURITY_ALLOW_EMBEDDING=true
    volumes:
      - ./grafana-config/provisioning:/etc/grafana/provisioning
      - ./grafana-config/dashboards:/var/lib/grafana/dashboards
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 256m

  consul:
    image: hashicorp/consul:1.16.0
    container_name: "dev-consul"
    environment:
      - "CONSUL_BIND_INTERFACE=eth0"
    ports:
      - "8301:8301"
      - "8400:8400"
      - "8500:8500" # Consul Manager
      - "8600:53/udp"
    command: "agent -server -bootstrap -ui -client=0.0.0.0 -bind='{{ GetInterfaceIP \"eth0\" }}'"
  mysql:
    image: mysql:8.0
    platform: linux/amd64
    container_name: mysql
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=consul-example
      - MYSQL_USER=consul
      - MYSQL_PASSWORD=example
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 10s
      timeout: 5s
      retries: 10
  front-1:
    build: ./spring-boot-front
    container_name: front
    environment:
      - SERVER_PORT=8080
      - SERVICE_ALIAS=front
      - SPRING_CLOUD_CONSUL_DISCOVERY_HOSTNAME=front
    hostname: front
    ports:
      - "8080:8080"
    links:
      - consul
      - logstash
    depends_on:
      consul:
        condition: service_started
      logstash:
        condition: service_started
  service-1:
    build: ./spring-boot-service
    container_name: service-1
    environment:
      - SERVER_PORT=8081
      - SERVICE_ALIAS=service-1
      - SPRING_CLOUD_CONSUL_DISCOVERY_HOSTNAME=service-1
    hostname: service-1
    ports:
      - "8081:8081"
    links:
      - consul
      - mysql
      - logstash
    depends_on:
      mysql:
        condition: service_healthy
      consul:
        condition: service_started
      logstash:
        condition: service_started
  service-2:
    build: ./spring-boot-service
    container_name: service-2
    environment:
      - SERVER_PORT=8082
      - SERVICE_ALIAS=service-2
      - SPRING_CLOUD_CONSUL_DISCOVERY_HOSTNAME=service-2
    hostname: service-2
    ports:
      - "8082:8082"
    links:
      - consul
      - mysql
      - logstash
    depends_on:
      service-1:
        condition: service_started
  service-3:
    build: ./spring-boot-service
    container_name: service-3
    restart: always
    environment:
      - SERVER_PORT=8083
      - SERVICE_ALIAS=service-3
      - SPRING_CLOUD_CONSUL_DISCOVERY_HOSTNAME=service-3
    hostname: service-3
    ports:
      - "8083:8083"
    links:
      - consul
      - mysql
      - logstash
    depends_on:
      service-2:
        condition: service_started

volumes:
  elasticsearch_data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
