spring:
  application:
    name: person-service-client-test
  cloud:
    consul:
      enabled: false
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
    url: jdbc:h2:mem:testdb;MODE=MySQL
  h2:
    console:
      enabled: false

hibernate:
  hbm2ddl:
    auto: create-drop

server:
  port: 0

logging:
  level:
    root: WARN
    io.github.joxebus: INFO
